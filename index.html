<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Roguelike</title>
  <link rel="icon" href="data:;base64,," />
  <style>
    html, body {
      height: 100%;
      overscroll-behavior: none; /* prevent bounce/scroll on mobile */
      touch-action: none; /* disable default touch handling */
    }
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    #game {
      line-height: 1;
      font-family: monospace;
      touch-action: none; /* для мобильного */
    }
    /* Mobile UI styles */
    .mobile-controls {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: none; /* enable on children only */
      z-index: 50;
    }
    .dpad, .actions {
      display: grid;
      gap: 6px;
      pointer-events: auto;
    }
    .dpad {
      grid-template-columns: 44px 44px 44px;
      grid-template-rows: 44px 44px 44px;
      width: 132px;
      height: 132px;
      place-items: center;
      opacity: 0.9;
    }
    .actions {
      grid-template-columns: 56px;
      grid-auto-rows: 56px;
      opacity: 0.9;
    }
    .ctl-btn {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.06);
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .action-btn { width: 56px; height: 56px; border-radius: 12px; }
    .menu-overlay {
      position: fixed;
      left: 0; right: 0; top: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      color: white;
      font-family: monospace;
    }
    .menu-panel {
      background: #111;
      padding: 18px;
      border-radius: 8px;
      min-width: 220px;
      text-align: center;
    }
    .menu-panel button { margin: 8px 0; width: 100%; padding: 8px; }
    .menu-toggle {
      position: fixed; left: 12px; top: 12px; z-index: 70;
      background: rgba(255,255,255,0.06); color: white; border-radius: 8px; padding: 8px;
      font-family: monospace; pointer-events: auto;
    }
    @media(min-width:800px) {
      .mobile-controls { display: none; }
      .menu-toggle { display: none; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- mobile/menu UI -->
  <button id="menuToggle" class="menu-toggle">Menu</button>

  <div id="menu" class="menu-overlay" style="display:none">
    <div class="menu-panel">
      <h3>Mini Roguelike</h3>
      <div style="margin-bottom:8px">Touch controls: D-pad + actions</div>
      <button id="startBtn">Start / Restart</button>
      <button id="resumeBtn">Resume</button>
      <button id="showInvBtn">Inventory</button>
      <button id="closeMenuBtn">Close</button>
    </div>
  </div>

  <div class="mobile-controls" id="mobileControls">
    <div class="dpad" id="dpad">
      <div></div>
      <div class="ctl-btn" data-dir="0,-1">↑</div>
      <div></div>
      <div class="ctl-btn" data-dir="-1,0">←</div>
      <div></div>
      <div class="ctl-btn" data-dir="1,0">→</div>
      <div></div>
      <div class="ctl-btn" data-dir="0,1">↓</div>
      <div></div>
    </div>
    <div class="actions">
      <div class="ctl-btn action-btn" id="useBtn">U</div>
      <div class="ctl-btn action-btn" id="invBtn">I</div>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>

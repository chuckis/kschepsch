<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Roguelike</title>
  <link rel="icon" href="data:;base64,," />
  <style>
    html, body {
      height: 100%;
      overscroll-behavior: none; /* prevent bounce/scroll on mobile */
      touch-action: none; /* disable default touch handling */
    }
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    #game {
      line-height: 1;
      font-family: monospace;
      touch-action: none; /* для мобильного */
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      overflow: hidden;
    }
    /* Mobile UI styles */
    .mobile-controls {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: none; /* enable on children only */
      z-index: 85; /* above game display */
    }
    .dpad, .actions {
      display: grid;
      gap: 6px;
      pointer-events: auto;
    }
    .dpad {
      grid-template-columns: 44px 44px 44px;
      grid-template-rows: 44px 44px 44px;
      width: 132px;
      height: 132px;
      place-items: center;
      opacity: 0.9;
    }
    .actions {
      grid-template-columns: 56px;
      grid-auto-rows: 56px;
      opacity: 0.9;
    }
    .ctl-btn {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.06);
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .action-btn { width: 56px; height: 56px; border-radius: 12px; }
    .menu-overlay {
      position: fixed;
      left: 0; right: 0; top: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 95;
      color: white;
      font-family: monospace;
    }
    .cutscene-overlay {
      position: fixed;
      left: 0; right: 0; top: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 98;
      color: #f5f5f5;
      font-family: monospace;
      padding: 16px;
      text-align: left;
    }
    .cutscene-panel {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px;
      max-width: 520px;
      width: min(92vw, 520px);
      box-shadow: 0 0 18px rgba(0,0,0,0.6);
    }
    .cutscene-title {
      font-size: 16px;
      margin: 0 0 10px;
      color: #f0d28b;
    }
    .cutscene-block {
      background: #141414;
      border: 1px solid #2b2b2b;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .cutscene-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .cutscene-actions button {
      background: #1e1e1e;
      border: 1px solid #3a3a3a;
      color: #f5f5f5;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: monospace;
    }
    .menu-panel {
      background: #111;
      padding: 18px;
      border-radius: 8px;
      min-width: 220px;
      text-align: center;
    }
    .menu-panel button { margin: 8px 0; width: 100%; padding: 8px; }
    .menu-toggle {
      position: fixed; left: 12px; top: 12px; z-index: 90;
      background: rgba(255,255,255,0.06); color: white; border-radius: 8px; padding: 8px;
      font-family: monospace; pointer-events: auto;
    }
    .floating-restart {
      position: fixed;
      left: 12px;
      bottom: 90px;
      z-index: 999; /* place above overlays so it's clickable after death */
      background: rgba(200,40,40,0.95);
      color: white;
      border: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: monospace;
      display: none;
      pointer-events: auto;
    }
    /* pulse animation */
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(200,40,40,0.6); }
      70% { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(200,40,40,0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(200,40,40,0); }
    }
    @media(min-width:800px) {
      .mobile-controls { display: none; }
      .menu-toggle { display: none; }
    }
    @media(max-width:799px) {
      .floating-restart {
        left: 12px;
        bottom: 84px;
        padding: 14px 18px;
        font-size: 18px;
        border-radius: 10px;
        transform-origin: center;
        animation: pulse 1.6s ease-in-out infinite;
      }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- mobile/menu UI -->
  <button id="menuToggle" class="menu-toggle">Menu</button>

  <div id="menu" class="menu-overlay" style="display:none">
    <div class="menu-panel">
      <h3>Mini Roguelike</h3>
      <div style="margin-bottom:8px">Touch controls: D-pad + actions</div>
      <button id="startBtn">Start / Restart</button>
      <button id="resumeBtn">Resume</button>
      <button id="showInvBtn">Inventory</button>
      <button id="closeMenuBtn">Close</button>
    </div>
  </div>

  <div id="deathOverlay" class="menu-overlay" style="display:none">
    <div class="menu-panel">
      <button id="deathClose" style="position:absolute; right:14px; top:10px; background:transparent; border:none; color:#f88; font-size:20px;">×</button>
      <h3>You died</h3>
      <div style="margin-bottom:8px">Game over. Start a new run?</div>
      <!-- Restart moved to floating red button/menu to avoid overlay blocking touch events -->
      <div style="margin-top:8px;color:#f88">Use the Restart button (red) or open Menu to start a new run.</div>
    </div>
  </div>

  <div id="cutsceneOverlay" class="cutscene-overlay" role="dialog" aria-live="polite">
    <div class="cutscene-panel">
      <h3 class="cutscene-title" id="cutsceneTitle">Cutscene</h3>
      <div id="cutsceneBlocks"></div>
      <div class="cutscene-actions">
        <button id="cutsceneContinue">Continue</button>
      </div>
    </div>
  </div>

  <div class="mobile-controls" id="mobileControls">
    <div class="dpad" id="dpad">
      <div></div>
      <div class="ctl-btn" data-dir="0,-1">↑</div>
      <div></div>
      <div class="ctl-btn" data-dir="-1,0">←</div>
      <div></div>
      <div class="ctl-btn" data-dir="1,0">→</div>
      <div></div>
      <div class="ctl-btn" data-dir="0,1">↓</div>
      <div></div>
    </div>
    <div class="actions">
      <div class="ctl-btn action-btn" id="useBtn">U</div>
      <div class="ctl-btn action-btn" id="invBtn">I</div>
    </div>
  </div>

  <button id="floatingRestart" class="floating-restart">Restart</button>

  <script type="module" src="./game.js"></script>
</body>
</html>
